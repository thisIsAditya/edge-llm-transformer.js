name: local-llm

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: local_llm_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d local_llm_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-erwan2/DeepSeek-R1-Distill-Qwen-1.5B}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$OLLAMA_MODEL\" && ollama pull \"$$OLLAMA_EMBED_MODEL\""]
    restart: "no"

  core:
    build: ./core
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/local_llm_agent
      EXA_API_KEY: ${EXA_API_KEY:?Set EXA_API_KEY in .env}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-erwan2/DeepSeek-R1-Distill-Qwen-1.5B}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3210/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ASR_MODEL_ID: ${VITE_ASR_MODEL_ID:-}
        VITE_ASR_LOCAL_MODELS: ${VITE_ASR_LOCAL_MODELS:-false}
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend/public/models:/usr/share/nginx/html/models:ro

volumes:
  pgdata:
  ollama:
