server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # COOP/COEP enable SharedArrayBuffer, which ONNX Runtime WASM needs for threading.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;

  # Same origin as the app, so the browser needs no CORS and VITE_API_BASE_URL stays empty.
  location /api/ {
    proxy_pass http://core:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Chat responses stream token by token; buffering would hold them until the end.
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Optional fine-tuned ONNX models, bind-mounted by docker-compose.yml.
  location /models/ {
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
